<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漫剧工作台</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="nav"></aside>
  <section class="work">
    <header class="top">
      <button class="icon" data-act="toggle-nav" title="收起 / 展开导航"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="crumb">
        <select id="project-switch" title="切换项目"></select>
        <span class="sep">/</span>
        <b id="page-title">项目总览</b>
      </div>
      <div class="spacer"></div>
      <div class="wallet">
        <span class="coin"></span>
        <strong id="top-balance">0</strong><span>积分</span>
        <span class="frz">冻结 <b id="top-frozen">0</b></span>
        <button class="btn sm" data-act="nav" data-page="credits">账单</button>
      </div>
    </header>
    <nav class="steps" id="steps"></nav>
    <div class="busybar" id="busybar" hidden></div>
    <main class="view"><div class="wrap" id="view"></div></main>
  </section>
</div>

<div class="drawer" id="drawer"></div>
<div class="modal-mask" id="modal-mask" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/datasource.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
